<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كامورو — لوحة التحكم</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh}
.hidden{display:none!important}

/* ===== شاشة تسجيل الدخول ===== */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:380px;background:#131313;border:1px solid #222;border-radius:16px;padding:34px 26px;text-align:center}
.login-box h1{font-size:22px;margin-bottom:6px;background:linear-gradient(90deg,#ffb300,#b78103);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-box p{color:#8e9aa8;font-size:13px;margin-bottom:20px}
.login-box input{width:100%;height:48px;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:10px;padding:0 14px;color:#fff;font-size:14px;outline:none;margin-bottom:12px;text-align:center}
.login-box input:focus{border-color:#ffb300}
.login-box input:disabled{opacity:.5}
.login-box button{width:100%;height:48px;border:none;border-radius:24px;background:linear-gradient(90deg,#ffb300,#b78103);color:#000;font-size:15px;font-weight:700;cursor:pointer;transition:.2s}
.login-box button:hover{opacity:.9}
.login-box button:active{transform:scale(.98)}
.login-box button:disabled{opacity:.5;cursor:wait}
.err{color:#ff6b6b;font-size:13px;margin-bottom:10px;min-height:18px;word-break:break-word}
.hint{color:#5c6b7a;font-size:12px;margin-top:14px;border-top:1px solid #222;padding-top:12px}

/* ===== الهيدر ===== */
header{position:sticky;top:0;background:#0a0a0a;border-bottom:1px solid #1c1c1c;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;z-index:10;flex-wrap:wrap;gap:8px}
header h1{font-size:18px;background:linear-gradient(90deg,#ffb300,#b78103);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.head-actions{display:flex;align-items:center;gap:8px}
.head-actions span{color:#8e9aa8;font-size:13px}
.head-actions button{border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;color:#000;background:#ffb300}
.head-actions button.danger{background:#e0245e;color:#fff}

/* ===== الإحصائيات ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;padding:16px 20px}
.stat{background:#131313;border:1px solid #1f1f1f;border-radius:12px;padding:14px;text-align:center}
.stat b{display:block;font-size:22px;background:linear-gradient(90deg,#ffb300,#b78103);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat span{color:#8e9aa8;font-size:12px}

/* ===== التبويبات ===== */
.tabs{display:flex;gap:6px;padding:0 20px 14px;border-bottom:1px solid #1c1c1c;overflow-x:auto}
.tab{border:none;background:#131313;color:#cfd6dd;border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.active{background:linear-gradient(90deg,#ffb300,#b78103);color:#000;font-weight:700}

/* ===== المحتوى ===== */
main{padding:16px 20px;max-width:900px;margin:0 auto}
.search-row{display:flex;gap:8px;margin-bottom:12px}
.search-row input{flex:1;height:40px;background:#131313;border:1px solid #2a2a2a;border-radius:10px;padding:0 12px;color:#fff;font-size:13px;outline:none}
.search-row input:focus{border-color:#ffb300}
.search-row button{border:none;border-radius:10px;padding:0 18px;background:#ffb300;color:#000;font-weight:700;cursor:pointer}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:#131313;border:1px solid #1f1f1f;border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#1c1c1c;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px;color:#ffb300}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.main{flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px}
.main b{font-size:14px}
.main small{color:#8e9aa8;font-size:12px}
.meta{color:#8e9aa8;font-size:12px}
.tag{font-size:10px;padding:2px 8px;border-radius:10px;background:#1c1c1c;color:#ffb300;margin-right:6px}
.btn{border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;color:#fff}
.btn.ok{background:#1da1f2}
.btn.warn{background:#ffb300;color:#000}
.btn.danger{background:#e0245e}
.empty{color:#8e9aa8;text-align:center;padding:30px;font-size:14px}
</style>
</head>
<body>

<!-- ===== شاشة تسجيل الدخول ===== -->
<div id="loginScreen">
  <div class="login-box">
    <h1>كامورو — لوحة التحكم</h1>
    <p>سجّل الدخول بحساب أدمن للمتابعة</p>

    <form id="loginForm" onsubmit="return doLogin(event)" autocomplete="on">
      <input type="text" id="adminUser" placeholder="اسم المستخدم" autocomplete="username" required>
      <input type="password" id="adminPass" placeholder="كلمة المرور" autocomplete="current-password" required>
      <div class="err" id="loginErr"></div>
      <button type="submit" id="loginBtn">تسجيل الدخول</button>
    </form>

    <div class="hint" id="loginHint">الحساب الافتراضي: camorro / admin123</div>
  </div>
</div>

<!-- ===== لوحة التحكم ===== -->
<div id="panel" class="hidden">
  <header>
    <h1>لوحة تحكم كامورو</h1>
    <div class="head-actions">
      <span>👤 <b id="adminName"></b></span>
      <button onclick="refreshAll()">🔄 تحديث</button>
      <button class="danger" onclick="logout()">خروج</button>
    </div>
  </header>

  <div id="statsEl" class="stats"></div>

  <nav class="tabs">
    <button class="tab active" id="tab-users" onclick="switchTab('users')">👥 المستخدمون</button>
    <button class="tab" id="tab-posts" onclick="switchTab('posts')">📷 المنشورات</button>
    <button class="tab" id="tab-comments" onclick="switchTab('comments')">💬 التعليقات</button>
    <button class="tab" id="tab-stories" onclick="switchTab('stories')">⏱️ القصص</button>
  </nav>

  <main>
    <div id="panel-users">
      <div class="search-row">
        <input id="userSearch" placeholder="ابحث عن مستخدم بالاسم أو البريد...">
        <button onclick="loadUsers()">بحث</button>
      </div>
      <div id="usersList" class="list"></div>
    </div>
    <div id="panel-posts" class="hidden">
      <div id="postsList" class="list"></div>
    </div>
    <div id="panel-comments" class="hidden">
      <div id="commentsList" class="list"></div>
    </div>
    <div id="panel-stories" class="hidden">
      <div id="storiesList" class="list"></div>
    </div>
  </main>
</div>

<script src="config.js"></script>
<script>
/* ============================================================
   كامورو — لوحة التحكم (نسخة معدلة بالكامل)
   زر الدخول: form + onsubmit + onclick = يعمل دائماً
   ============================================================ */

var KEY = 'camorro_admin_key';
var NAME_KEY = 'camorro_admin_name';
var API = (typeof API_URL !== 'undefined' ? API_URL : 'https://jzvmvjgkbwziwbnrfgwn.supabase.co');
var curTab = 'users';

/* ===== طلب موثوق مع مهلة للخادم النائم ===== */
async function api(path, method, body) {
  var isForm = body instanceof FormData;
  var headers = {};
  var token = localStorage.getItem(KEY);
  if (token) headers['x-admin-token'] = token;
  if (!isForm && body !== undefined) headers['Content-Type'] = 'application/json';

  var res;
  try {
    res = await fetch(API + path, {
      method: method || 'GET',
      headers: headers,
      body: body ? (isForm ? body : JSON.stringify(body)) : undefined
    });
  } catch (netErr) {
    throw new Error('تعذر الاتصال بالخادم: ' + netErr.message + ' — تأكد أن Render مستيقظ (يستيقظ خلال دقيقة)');
  }

  if (res.status === 401) {
    localStorage.removeItem(KEY);
    showLogin();
    throw new Error('انتهت الجلسة، سجّل الدخول مجدداً');
  }

  var data = {};
  try { data = await res.json(); }
  catch (e) {
    var text = await res.text().catch(function () { return ''; });
    if (res.status === 503) {
      throw new Error('الخادم نائم على Render (الخطة المجانية). انتظر 30–60 ثانية ثم اضغط الدخول مجدداً.');
    }
    throw new Error('رد غير مفهوم من الخادم (' + res.status + '): ' + text.slice(0, 120));
  }

  if (!res.ok) throw new Error(data.error || 'خطأ في الخادم (' + res.status + ')');
  return data;
}

/* ===== تسجيل الدخول — الدالة الأساسية ===== */
async function doLogin(e) {
  if (e && e.preventDefault) e.preventDefault();

  var userEl = document.getElementById('adminUser');
  var passEl = document.getElementById('adminPass');
  var errEl  = document.getElementById('loginErr');
  var btnEl  = document.getElementById('loginBtn');
  var hintEl = document.getElementById('loginHint');

  var username = userEl.value.trim();
  var password = passEl.value;

  errEl.textContent = '';

  if (!username || !password) {
    errEl.textContent = 'أدخل اسم المستخدم وكلمة المرور';
    userEl.focus();
    return false;
  }

  btnEl.disabled = true;
  btnEl.textContent = 'جارٍ تسجيل الدخول...';
  if (hintEl) hintEl.style.display = 'none';

  try {
    /* جرّب المسار الجديد أولاً، ثم القديم إذا لم يوجد */
    var data;
    try {
      data = await api('/api/admin/login', 'POST', { username: username, password: password });
    } catch (firstErr) {
      if (String(firstErr.message).indexOf('404') !== -1) {
        data = await api('/api/auth/admin', 'POST', { username: username, password: password });
      } else {
        throw firstErr;
      }
    }

    if (!data.token) throw new Error('الخادم لم يرجع رمز دخول صحيح');

    localStorage.setItem(KEY, data.token);
    localStorage.setItem(NAME_KEY, data.username || username);

    showPanel();
    loadStats();
    loadUsers();
    switchTab('users');
  } catch (err) {
    errEl.textContent = err.message;
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = 'تسجيل الدخول';
  }
  return false;
}

/* ===== إظهار اللوحة / شاشة الدخول ===== */
function showPanel() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  document.getElementById('adminName').textContent = localStorage.getItem(NAME_KEY) || 'أدمن';
}

function showLogin() {
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('panel').classList.add('hidden');
}

function logout() {
  localStorage.removeItem(KEY);
  localStorage.removeItem(NAME_KEY);
  showLogin();
}

/* ===== الإحصائيات ===== */
async function loadStats() {
  try {
    var s = await api('/api/admin/stats');
    document.getElementById('statsEl').innerHTML = [
      ['👥', s.users, 'مستخدم'], ['📷', s.posts, 'منشور'], ['🎬', s.reels, 'ريلز'],
      ['⏱️', s.stories, 'قصة'], ['💬', s.comments, 'تعليق'], ['🤝', s.follows, 'متابعة'],
      ['✉️', s.messages, 'رسالة'], ['🗨️', s.conversations, 'محادثة']
    ].map(function (x) {
      return '<div class="stat"><b>' + x[1] + '</b><span>' + x[0] + ' ' + x[2] + '</span></div>';
    }).join('');
  } catch (e) {}
}

/* ===== التبويبات ===== */
function switchTab(t) {
  curTab = t;
  ['users', 'posts', 'comments', 'stories'].forEach(function (n) {
    document.getElementById('tab-' + n).classList.toggle('active', n === t);
    document.getElementById('panel-' + n).classList.toggle('hidden', n !== t);
  });
  if (t === 'users') loadUsers();
  if (t === 'posts') loadPosts();
  if (t === 'comments') loadComments();
  if (t === 'stories') loadStories();
}

/* ===== المستخدمون ===== */
async function loadUsers() {
  var list = document.getElementById('usersList');
  try {
    var q = document.getElementById('userSearch').value.trim();
    var users = await api('/api/admin/users?q=' + encodeURIComponent(q));
    list.innerHTML = users.length ? users.map(function (u) {
      var av = u.avatar_url
        ? '<img src="' + assetUrl(u.avatar_url) + '" onerror="this.style.display=\'none\'">'
        : '<span>' + esc(u.username[0].toUpperCase()) + '</span>';
      return '<div class="row">'
        + '<div class="thumb">' + av + '</div>'
        + '<div class="main"><b>' + esc(u.username) + '</b>' + (u.is_private ? '<span class="tag">🔒 خاص</span>' : '')
        + '<small>' + esc(u.email) + '</small>'
        + '<small>سجل: ' + fmt(u.created_at) + '</small></div>'
        + '<div class="meta">' + u.post_count + ' منشور • ' + u.followers + ' متابع</div>'
        + '<button class="btn ok" onclick="togglePrivate(' + u.id + ',' + (u.is_private ? 'false' : 'true') + ')">' + (u.is_private ? 'جعله عاماً' : 'اجعله خاصاً') + '</button>'
        + '<button class="btn warn" onclick="resetPass(' + u.id + ')">🔑 كلمة السر</button>'
        + '<button class="btn danger" onclick="delUser(' + u.id + ')">حذف</button>'
        + '</div>';
    }).join('') : '<p class="empty">لا يوجد مستخدمون</p>';
  } catch (e) {
    list.innerHTML = '<p class="empty">' + esc(e.message) + '</p>';
  }
}

async function togglePrivate(id, val) {
  try {
    await api('/api/admin/users/' + id + '/private', 'PATCH', { is_private: val });
    loadUsers(); loadStats();
  } catch (e) { alert(e.message); }
}

async function resetPass(id) {
  var np = prompt('كلمة المرور الجديدة (6 أحرف على الأقل):');
  if (!np) return;
  try {
    await api('/api/admin/users/' + id + '/reset-password', 'POST', { new_password: np });
    alert('✅ تم تغيير كلمة المرور');
    loadUsers(); loadStats();
  } catch (e) { alert(e.message); }
}

function delUser(id) {
  if (!confirm('حذف هذا المستخدم نهائياً؟ سيتم حذف كل منشوراته وقصصه وتعليقاته')) return;
  api('/api/admin/users/' + id, 'DELETE').then(function () { loadUsers(); loadStats(); }).catch(function (e) { alert(e.message); });
}

/* ===== المنشورات ===== */
async function loadPosts() {
  var list = document.getElementById('postsList');
  try {
    var posts = await api('/api/admin/posts');
    list.innerHTML = posts.length ? posts.map(function (p) {
      var media = p.media_url
        ? (p.media_type === 'video'
          ? '<div class="thumb"><video src="' + assetUrl(p.media_url) + '" muted playsinline preload="metadata"></video></div>'
          : '<img class="thumb" src="' + assetUrl(p.media_url) + '" onerror="this.style.display=\'none\'">')
        : '<div class="thumb">📝</div>';
      return '<div class="row">' + media
        + '<div class="main"><b>' + esc(p.username) + '</b>' + (p.is_reel ? '<span class="tag">🎬 ريلز</span>' : '')
        + '<small>' + esc(p.caption || '(بدون وصف)') + '</small>'
        + '<small>' + fmt(p.created_at) + '</small></div>'
        + '<div class="meta">' + p.likes_count + ' ❤️ • ' + p.comments_count + ' 💬</div>'
        + '<button class="btn danger" onclick="delPost(' + p.id + ')">حذف</button>'
        + '</div>';
    }).join('') : '<p class="empty">لا توجد منشورات</p>';
  } catch (e) {
    list.innerHTML = '<p class="empty">' + esc(e.message) + '</p>';
  }
}

function delPost(id) {
  if (!confirm('حذف هذا المنشور نهائياً؟')) return;
  api('/api/admin/posts/' + id, 'DELETE').then(function () { loadPosts(); loadStats(); }).catch(function (e) { alert(e.message); });
}

/* ===== التعليقات ===== */
async function loadComments() {
  var list = document.getElementById('commentsList');
  try {
    var comments = await api('/api/admin/comments');
    list.innerHTML = comments.length ? comments.map(function (c) {
      return '<div class="row">'
        + '<div class="thumb">💬</div>'
        + '<div class="main"><b>' + esc(c.username) + '</b><small>' + esc(c.body) + '</small><small>' + fmt(c.created_at) + '</small></div>'
        + '<div class="meta">على منشور #' + c.post_id + '</div>'
        + '<button class="btn danger" onclick="delComment(' + c.id + ')">حذف</button>'
        + '</div>';
    }).join('') : '<p class="empty">لا توجد تعليقات</p>';
  } catch (e) {
    list.innerHTML = '<p class="empty">' + esc(e.message) + '</p>';
  }
}

function delComment(id) {
  if (!confirm('حذف هذا التعليق؟')) return;
  api('/api/admin/comments/' + id, 'DELETE').then(function () { loadComments(); loadStats(); }).catch(function (e) { alert(e.message); });
}

/* ===== القصص ===== */
async function loadStories() {
  var list = document.getElementById('storiesList');
  try {
    var stories = await api('/api/admin/stories');
    list.innerHTML = stories.length ? stories.map(function (s) {
      var media = s.media_type === 'video'
        ? '<div class="thumb"><video src="' + assetUrl(s.media_url) + '" muted playsinline preload="metadata"></video></div>'
        : '<img class="thumb" src="' + assetUrl(s.media_url) + '" onerror="this.style.display=\'none\'">';
      return '<div class="row">' + media
        + '<div class="main"><b>' + esc(s.username) + '</b>'
        + '<span class="tag">' + (s.expired ? '⏰ منتهية' : '🟢 نشطة') + '</span>'
        + '<small>' + fmt(s.created_at) + '</small></div>'
        + '<div class="meta">' + (s.expired ? 'انتهت صلاحيتها' : 'تنتهي خلال 24 ساعة') + '</div>'
        + '<button class="btn danger" onclick="delStory(' + s.id + ')">حذف</button>'
        + '</div>';
    }).join('') : '<p class="empty">لا توجد قصص</p>';
  } catch (e) {
    list.innerHTML = '<p class="empty">' + esc(e.message) + '</p>';
  }
}

function delStory(id) {
  if (!confirm('حذف هذه القصة؟')) return;
  api('/api/admin/stories/' + id, 'DELETE').then(function () { loadStories(); loadStats(); }).catch(function (e) { alert(e.message); });
}

/* ===== تحديث عام ===== */
function refreshAll() {
  loadStats();
  if (curTab === 'users') loadUsers();
  if (curTab === 'posts') loadPosts();
  if (curTab === 'comments') loadComments();
  if (curTab === 'stories') loadStories();
}

/* ===== أدوات مساعدة ===== */
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function fmt(d) {
  try { return new Date(d).toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' }); }
  catch (e) { return String(d || ''); }
}
function assetUrl(u) { return u || ''; }

/* ===== ربط الأحداث (ثلاث طرق ضمان) ===== */
window.doLogin = doLogin; /* 1) الربط المباشر */
document.getElementById('loginForm').addEventListener('submit', function (e) { e.preventDefault(); doLogin(e); }); /* 2) النموذج */
document.getElementById('loginBtn').addEventListener('click', function (e) { e.preventDefault(); doLogin(e); }); /* 3) الزر */

document.getElementById('adminPass').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); doLogin(e); }
});

/* ===== التشغيل: إذا كان هناك توكن محفوظ → ادخل مباشرة ===== */
(function init() {
  var token = localStorage.getItem(KEY);
  if (token) {
    api('/api/admin/stats').then(function () {
      showPanel();
      loadStats();
      loadUsers();
    }).catch(function () {
      localStorage.removeItem(KEY);
      showLogin();
    });
  } else {
    showLogin();
  }

  /* تحديث تلقائي كل 20 ثانية */
  setInterval(function () {
    if (localStorage.getItem(KEY)) refreshAll();
  }, 20000);
})();
</script>
</body>
</html>
