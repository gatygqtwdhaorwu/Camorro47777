<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>إنشاء حساب — كامورو</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,Cantarell,sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:#0f1c2e;color:white;height:100vh;height:-webkit-fill-available;display:flex;justify-content:center;align-items:center;overflow:hidden;}
.container{display:flex;width:100%;max-width:414px;height:100%;padding:30px 24px calc(20px + env(safe-area-inset-bottom)) 24px;flex-direction:column;align-items:center;justify-content:space-between;}
.main-content{width:100%;display:flex;flex-direction:column;align-items:center;margin-top:20px;}
.logo{margin-bottom:30px;}
.logo svg{width:80px;height:80px;box-shadow:0 10px 25px rgba(0,0,0,.3);border-radius:24px;}
h1{font-size:22px;margin-bottom:24px;background:linear-gradient(45deg,#ffe082,#ffb300,#b78103);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.input-box{width:100%;margin-bottom:16px;}
.input-box input{width:100%;height:56px;border:1.5px solid #22354f;border-radius:16px;background:#16263d;color:white;font-size:15px;padding:0 18px;outline:none;transition:.2s;text-align:right;}
.input-box input:focus{border-color:#ffb300;}
.input-box input::placeholder{color:#738499;}
.login-btn{width:100%;height:54px;border:none;border-radius:27px;background:linear-gradient(90deg,#ffb300,#b78103);color:#0f1c2e;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px;box-shadow:0 4px 15px rgba(255,179,0,.2);}
.login-btn:disabled{opacity:.6;}
.error-msg{color:#ff5252;font-size:13px;display:none;margin-bottom:15px;text-align:center;}
.bottom{width:100%;text-align:center;}
.create{width:100%;height:50px;border:1.5px solid #ffb300;border-radius:25px;background:transparent;color:#ffb300;font-size:15px;font-weight:600;cursor:pointer;margin-top:25px;}
.meta{margin-top:15px;font-size:14px;color:#8e9aa8;font-weight:500;}
.loading-screen{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0f1c2e;z-index:99999;flex-direction:column;align-items:center;justify-content:center;gap:15px;}
.loading-screen .spinner{width:42px;height:42px;border:4px solid #16263d;border-top-color:#ffb300;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-screen p{font-size:15px;color:#8e9aa8;}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute;top:-9999px;left:-9999px;" aria-hidden="true">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#B78103"/>
    </linearGradient>
  </defs>
</svg>

<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <p>جاري إنشاء الحساب...</p>
</div>

<div class="container">
  <div class="main-content">
    <div class="logo">
      <svg viewBox="0 0 100 100" fill="none">
        <rect width="100" height="100" rx="28" fill="#16263d"/>
        <circle cx="50" cy="50" r="34" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-dasharray="14 6"/>
        <path d="M30 66 V34 L50 52 L70 34 V66" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>إنشاء حساب جديد</h1>

    <div class="input-box"><input type="text" id="username" placeholder="اسم المستخدم (3-30 حرف)"></div>
    <div class="input-box"><input type="email" id="email" placeholder="البريد الإلكتروني"></div>
    <div class="input-box"><input type="password" id="password" placeholder="كلمة المرور (6 أحرف على الأقل)"></div>

    <div class="error-msg" id="regError"></div>

    <button class="login-btn" id="regBtn">إنشاء الحساب</button>
  </div>

  <div class="bottom">
    <button class="create" id="backBtn">لديك حساب؟ سجّل الدخول</button>
    <div class="meta">Camorro App v1.0</div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  var username = document.getElementById('username');
  var email    = document.getElementById('email');
  var password = document.getElementById('password');
  var regBtn   = document.getElementById('regBtn');
  var regError = document.getElementById('regError');
  var loadingScreen = document.getElementById('loadingScreen');

  regBtn.addEventListener('click', async function () {
    regError.style.display = 'none';

    var body = { username: username.value.trim(), email: email.value.trim(), password: password.value };
    if (!body.username || !body.email || !body.password) {
      regError.textContent = 'يرجى ملء جميع الحقول.';
      regError.style.display = 'block';
      return;
    }

    loadingScreen.style.display = 'flex';
    regBtn.disabled = true;

    try {
      var res = await fetch(API_URL + '/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'حدث خطأ');

      /* ===== إضافة كامورو: التوجه لصفحة إدخال كود التحقق ===== */
      if (data.needs_verification) {
        window.location.href = 'verify.html?email=' + encodeURIComponent(body.email.trim());
        return;
      }

      localStorage.setItem('camorro_token', data.token);
      window.location.href = 'home.html';
    } catch (err) {
      loadingScreen.style.display = 'none';
      regBtn.disabled = false;
      regError.textContent = err.message;
      regError.style.display = 'block';
    }
  });

  document.getElementById('backBtn').addEventListener('click', function () {
    window.location.href = 'index.html';
  });

  password.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') regBtn.click();
  });
})();
</script>
</body>
</html>
