<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>كامورو</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,Cantarell,sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:#0f1c2e;color:#fff;min-height:100vh;}
#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:#0f1c2e;}

/* ===== الهيدر ===== */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(15,28,46,.92);backdrop-filter:blur(8px);border-bottom:1px solid #22354f;}
.brand{font-size:22px;font-weight:800;background:linear-gradient(45deg,#ffe082,#ffb300,#b78103);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
header .actions{display:flex;gap:10px;}
.icon-btn{background:none;border:none;color:#c7d0dc;font-size:20px;cursor:pointer;padding:6px;border-radius:10px;}
.icon-btn:hover{background:#16263d;}

main{flex:1;padding-bottom:80px;}
.view{display:block;}
.muted{color:#8e9aa8;}
.center{text-align:center;}
.loading-txt{padding:40px 20px;text-align:center;color:#8e9aa8;}

/* ===== الستوري ===== */
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 16px;scrollbar-width:none;}
.stories::-webkit-scrollbar{display:none;}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;background:none;border:none;color:#fff;cursor:pointer;padding:0;}
.story .ring{width:64px;height:64px;border-radius:50%;padding:2.5px;background:linear-gradient(45deg,#ffe082,#ffb300,#b78103);}
.story span{font-size:11px;color:#c7d0dc;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.avatar-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffb300,#b78103);color:#0f1c2e;font-weight:800;border-radius:50%;overflow:hidden;flex-shrink:0;}
.avatar-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

/* ===== بطاقة المنشور ===== */
.post{background:#13233a;border:1px solid #22354f;border-radius:16px;margin:0 12px 16px;overflow:hidden;}
.post-head{display:flex;align-items:center;gap:10px;padding:12px 14px;}
.post-head b{font-size:14px;cursor:pointer;}
.post-head small{display:block;color:#8e9aa8;font-size:11px;margin-top:2px;}
.post-user{flex:1;}
.del-btn{background:none;border:none;color:#8e9aa8;font-size:16px;cursor:pointer;}
.post-media{width:100%;max-height:540px;object-fit:cover;background:#0f1c2e;display:block;cursor:pointer;}
video.post-media{max-height:540px;object-fit:contain;background:#000;}
.post-actions{display:flex;align-items:center;gap:16px;padding:10px 14px 4px;}
.action-btn{background:none;border:none;cursor:pointer;font-size:22px;color:#fff;}
.like-btn{background:none;border:none;cursor:pointer;font-size:22px;color:#fff;transition:transform .15s;}
.like-btn:active{transform:scale(1.25);}
.like-btn.liked{color:#ff5252;}
.post-caption{padding:8px 14px 6px;font-size:14px;line-height:1.7;word-break:break-word;}
.post-caption b{cursor:pointer;margin-left:6px;}
.like-count{font-size:13px;color:#c7d0dc;margin-top:6px;font-weight:600;}
.post-comments{padding:2px 14px 8px;}
.show-comments{background:none;border:none;color:#8e9aa8;font-size:12px;cursor:pointer;}
.comment-row{font-size:13px;margin-bottom:6px;line-height:1.6;color:#d6dde6;}
.comment-row b{cursor:pointer;margin-left:6px;color:#fff;}
.add-comment{display:flex;gap:8px;padding:8px 14px 14px;border-top:1px solid #1c2f4a;margin-top:4px;}
.add-comment input{flex:1;height:38px;background:#0f1c2e;border:1px solid #22354f;border-radius:19px;padding:0 14px;color:#fff;font-size:13px;outline:none;}
.add-comment input:focus{border-color:#ffb300;}
.add-comment button{background:linear-gradient(90deg,#ffb300,#b78103);border:none;color:#0f1c2e;font-weight:700;border-radius:19px;padding:0 16px;font-size:13px;cursor:pointer;}

/* ===== فارغ ===== */
.empty{padding:50px 24px;text-align:center;color:#8e9aa8;}
.empty button{margin-top:16px;background:linear-gradient(90deg,#ffb300,#b78103);border:none;color:#0f1c2e;font-weight:700;padding:12px 26px;border-radius:24px;font-size:14px;cursor:pointer;}

/* ===== الشريط السفلي ===== */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(15,28,46,.95);backdrop-filter:blur(8px);border-top:1px solid #22354f;z-index:60;}
nav button{background:none;border:none;color:#8e9aa8;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 10px;border-radius:12px;}
nav button.active{color:#ffb300;}
nav button span{font-size:21px;line-height:1;}
nav .add-tab{width:44px;height:44px;border-radius:50%;background:linear-gradient(90deg,#ffb300,#b78103);color:#0f1c2e;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin-top:-18px;box-shadow:0 4px 14px rgba(255,179,0,.35);}

/* ===== البحث ===== */
.search-box{padding:14px 16px 6px;}
.search-box input{width:100%;height:46px;background:#13233a;border:1px solid #22354f;border-radius:14px;padding:0 16px;color:#fff;font-size:14px;outline:none;}
.search-box input:focus{border-color:#ffb300;}
.user-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #1c2f4a;}
.u-info{flex:1;cursor:pointer;}
.u-info b{font-size:14px;}
.u-info small{display:block;color:#8e9aa8;font-size:12px;margin-top:2px;}
.follow-btn{background:none;border:1px solid #ffb300;color:#ffb300;font-weight:600;font-size:12px;padding:7px 16px;border-radius:18px;cursor:pointer;}
.follow-btn.following{background:#1c2f4a;border-color:#1c2f4a;color:#8e9aa8;}
.follow-btn.big{padding:10px 30px;font-size:13px;border-radius:22px;}
.edit-btn{background:none;border:1px solid #22354f;color:#c7d0dc;font-weight:600;font-size:12px;padding:10px 30px;border-radius:22px;cursor:pointer;}

/* ===== الملف الشخصي ===== */
.profile-head{display:flex;align-items:center;gap:20px;padding:20px 16px 10px;}
.p-stats{display:flex;flex:1;justify-content:space-around;text-align:center;}
.p-stats b{display:block;font-size:17px;}
.p-stats span{font-size:12px;color:#8e9aa8;}
.p-name{padding:4px 16px;font-size:15px;}
.p-bio{padding:2px 16px 10px;color:#c7d0dc;font-size:13px;line-height:1.7;}
.p-actions{padding:0 16px 16px;}
.p-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:6px 0 20px;}
.p-grid .cell{position:relative;width:100%;aspect-ratio:1/1;cursor:pointer;overflow:hidden;background:#13233a;}
.p-grid img,.p-grid video{width:100%;height:100%;object-fit:cover;display:block;}
.video-badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;}

/* ===== المودال العام ===== */
.modal{position:fixed;inset:0;background:rgba(5,12,22,.85);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(4px);}
.modal-box{width:100%;max-width:430px;background:#13233a;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:slideUp .25s ease;max-height:85vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-box h3{margin-bottom:16px;font-size:17px;}
.file-label{display:flex;align-items:center;justify-content:center;min-height:140px;border:2px dashed #22354f;border-radius:16px;cursor:pointer;margin-bottom:12px;color:#8e9aa8;overflow:hidden;background:#0f1c2e;text-align:center;}
.file-label img,.file-label video{width:100%;max-height:260px;object-fit:contain;}
.modal-box textarea{width:100%;min-height:80px;background:#0f1c2e;border:1px solid #22354f;border-radius:14px;padding:12px;color:#fff;font-size:14px;resize:vertical;outline:none;font-family:inherit;}
.modal-box textarea:focus{border-color:#ffb300;}
.publish{width:100%;height:48px;border:none;border-radius:24px;background:linear-gradient(90deg,#ffb300,#b78103);color:#0f1c2e;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px;}
.publish:disabled{opacity:.6;}
.cancel{width:100%;height:44px;border:none;border-radius:22px;background:#1c2f4a;color:#c7d0dc;font-size:14px;cursor:pointer;margin-top:8px;}

/* ===== عارض القصص ===== */
.story-viewer{width:100%;max-width:430px;height:100%;background:#000;position:relative;display:flex;align-items:center;justify-content:center;}
.sv-head{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:14px;z-index:10;background:linear-gradient(rgba(0,0,0,.6),transparent);}
.sv-head b{font-size:14px;}
.sv-head small{display:block;color:#c7d0dc;font-size:11px;}
.sv-close{margin-left:auto;background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}
.sv-progress{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.2);z-index:11;}
.sv-progress::after{content:'';display:block;height:100%;background:linear-gradient(90deg,#ffe082,#ffb300);animation:progress 5s linear forwards;}
@keyframes progress{from{width:0;}to{width:100%;}}
.sv-media{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.sv-media img,.sv-media video{max-width:100%;max-height:100%;object-fit:contain;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Camorro</div>
    <div class="actions">
      <button class="icon-btn" onclick="showSearch()" title="بحث">🔍</button>
      <button class="icon-btn" onclick="logout()" title="خروج">🚪</button>
    </div>
  </header>

  <main>
    <!-- التغذية -->
    <section class="view" id="view-feed">
      <div class="stories" id="storiesEl"></div>
      <div id="feedEl"><p class="loading-txt">جاري التحميل...</p></div>
    </section>

    <!-- البحث -->
    <section class="view" id="view-search" hidden>
      <div class="search-box"><input id="searchInput" placeholder="ابحث عن مستخدمين..."></div>
      <div id="resultsEl"><p class="muted center" style="padding:30px">ابحث عن مستخدمين بالاسم</p></div>
    </section>

    <!-- الملف الشخصي -->
    <section class="view" id="view-profile" hidden>
      <div id="profileEl"></div>
    </section>
  </main>

  <nav>
    <button class="active" data-view="feed" onclick="showFeed()"><span>🏠</span>الرئيسية</button>
    <button data-view="search" onclick="showSearch()"><span>🔍</span>بحث</button>
    <button class="add-tab" onclick="openCreate()">＋</button>
    <button data-view="profile" onclick="showProfile(me.username)"><span>👤</span>حسابي</button>
  </nav>

  <!-- مودال منشور جديد -->
  <div class="modal" id="createModal" hidden>
    <div class="modal-box">
      <h3>منشور جديد</h3>
      <label class="file-label" id="imgLabel">
        <input type="file" id="postMedia" accept="image/*,video/*" hidden>
        <span id="mediaPreview">📷 اضغط لاختيار صورة أو فيديو</span>
      </label>
      <textarea id="postCaption" placeholder="اكتب وصفاً للمنشور..."></textarea>
      <button class="publish" id="publishBtn" onclick="publishPost()">نشر</button>
      <button class="cancel" onclick="closeCreate()">إلغاء</button>
    </div>
  </div>

  <!-- مودال قصة جديدة -->
  <div class="modal" id="storyCreateModal" hidden>
    <div class="modal-box">
      <h3>قصة جديدة (تختفي بعد 24 ساعة)</h3>
      <label class="file-label">
        <input type="file" id="storyMedia" accept="image/*,video/*" hidden>
        <span id="storyPreview">📷 اختر صورة أو فيديو</span>
      </label>
      <button class="publish" id="storyPublishBtn" onclick="publishStory()">نشر القصة</button>
      <button class="cancel" onclick="closeStoryCreate()">إلغاء</button>
    </div>
  </div>

  <!-- عارض القصص -->
  <div class="modal" id="storyModal" hidden style="align-items:center;background:#000;">
    <div class="story-viewer">
      <div class="sv-progress" id="svProgress"></div>
      <div class="sv-head" id="svHead"></div>
      <div class="sv-media" id="svMedia"></div>
    </div>
  </div>

  <!-- مودال عرض منشور -->
  <div class="modal" id="postModal" hidden>
    <div class="modal-box">
      <div id="postModalBody"></div>
      <button class="cancel" onclick="document.getElementById('postModal').hidden=true">إغلاق</button>
    </div>
  </div>

  <!-- مودال الإعدادات -->
  <div class="modal" id="settingsModal" hidden>
    <div class="modal-box">
      <h3>تعديل الملف الشخصي</h3>
      <label class="file-label" id="avatarLabel">
        <input type="file" id="avatarInput" accept="image/*" hidden>
        <span id="avatarPreview">🖼️ اضغط لتغيير الصورة الشخصية</span>
      </label>
      <textarea id="bioInput" placeholder="اكتب نبذة عنك..."></textarea>
      <button class="publish" id="saveProfileBtn" onclick="saveProfile()">حفظ</button>
      <button class="cancel" onclick="closeSettings()">إلغاء</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
/* ============ المتغيرات العامة ============ */
const token = localStorage.getItem('camorro_token');
let me = null;
let currentProfileUser = null;
let searchTimer = null;
let storyList = [];
let storyIndex = 0;
let storyTimer = null;

const feedEl = document.getElementById('feedEl');
const storiesEl = document.getElementById('storiesEl');
const resultsEl = document.getElementById('resultsEl');
const profileEl = document.getElementById('profileEl');
const searchInput = document.getElementById('searchInput');

/* ============ أدوات مساعدة ============ */
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'الآن';
  const m = Math.floor(s / 60); if (m < 60) return m + ' دقيقة';
  const h = Math.floor(m / 60); if (h < 24) return h + ' ساعة';
  const d = Math.floor(h / 24); if (d < 7) return d + ' يوم';
  return new Date(iso).toLocaleDateString('ar');
}
/* تحويل روابط الملفات من الخادم إلى روابط كاملة */
function assetUrl(url) {
  if (!url) return '';
  return /^https?:/.test(url) ? url : API_URL + url;
}
/* مصغّرة الفيديو من Cloudinary (إطار أول) */
function thumbUrl(url) {
  if (!url) return '';
  if (/^https?:/.test(url) && url.includes('cloudinary.com')) {
    return url.replace('/upload/', '/upload/w_300/').replace(/\.[a-z0-9]+$/i, '.jpg');
  }
  return url;
}
function avatarHTML(u, size) {
  const letter = esc((u.username || '?')[0].toUpperCase());
  return '<span class="avatar-wrap" style="width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * 0.42) + 'px">'
    + letter
    + (u.avatar_url ? '<img src="' + assetUrl(u.avatar_url) + '" onerror="this.style.display=\'none\'">' : '')
    + '</span>';
}
function mediaHTML(p, clickable) {
  const src = assetUrl(p.media_url);
  const onClick = clickable ? ' onclick="openPost(' + p.id + ')"' : '';
  if (!src) return '';
  if (p.media_type === 'video') {
    return '<video class="post-media"' + onClick + ' src="' + src + '" controls playsinline preload="metadata"></video>';
  }
  return '<img class="post-media"' + onClick + ' src="' + src + '" loading="lazy" onerror="this.style.display=\'none\'">';
}
async function api(path, opts) {
  opts = opts || {};
  const headers = { 'Authorization': 'Bearer ' + token };
  if (opts.body && !(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  const res = await fetch(API_URL + path, Object.assign({}, opts, { headers: headers }));
  const data = await res.json().catch(function () { return {}; });
  if (!res.ok) throw new Error(data.error || 'حدث خطأ');
  return data;
}
function setView(v) {
  document.querySelectorAll('.view').forEach(function (el) { el.hidden = true; });
  const el = document.getElementById('view-' + v);
  if (el) el.hidden = false;
  document.querySelectorAll('nav button').forEach(function (b) {
    b.classList.toggle('active', b.dataset.view === v);
  });
  if (v === 'feed') currentProfileUser = null;
}

/* ============ التغذية ============ */
async function showFeed() {
  setView('feed');
  feedEl.innerHTML = '<p class="loading-txt">جاري تحميل المنشورات...</p>';
  try {
    const [posts, stories] = await Promise.all([api('/api/feed'), api('/api/stories')]);
    renderStories(stories);
    if (!posts.length) {
      feedEl.innerHTML = '<div class="empty">لا توجد منشورات بعد<br>تابع مستخدمين أو انشر أول منشور لك 🚀<br><button onclick="openCreate()">انشر الآن</button></div>';
      return;
    }
    feedEl.innerHTML = posts.map(function (p) { return postCard(p, ''); }).join('');
  } catch (e) {
    feedEl.innerHTML = '<p class="loading-txt">' + esc(e.message) + '</p>';
  }
}

function postCard(p, prefix) {
  const mine = me && p.user_id === me.id;
  return '<div class="post" data-post="' + p.id + '">'
    + '<div class="post-head">'
    + avatarHTML(p, 38)
    + '<div class="post-user"><b onclick="showProfile(\'' + p.username + '\')">' + esc(p.username) + '</b>'
    + '<small>' + timeAgo(p.created_at) + '</small></div>'
    + (mine ? '<button class="del-btn" onclick="delPost(' + p.id + ')" title="حذف">🗑️</button>' : '')
    + '</div>'
    + mediaHTML(p, true)
    + '<div class="post-actions">'
    + '<button class="like-btn' + (p.liked_by_me ? ' liked' : '') + '" onclick="toggleLike(' + p.id + ',this)">' + (p.liked_by_me ? '❤️' : '🤍') + '</button>'
    + '<button class="action-btn" onclick="document.getElementById(\'ci-' + prefix + p.id + '\').focus()">💬</button>'
    + '</div>'
    + '<div class="post-caption"><b onclick="showProfile(\'' + p.username + '\')">' + esc(p.username) + '</b>' + esc(p.caption)
    + '<div class="like-count" id="lc-' + prefix + p.id + '">' + p.like_count + ' إعجاب</div></div>'
    + '<div class="post-comments" id="comments-' + prefix + p.id + '">'
    + '<button class="show-comments" onclick="loadComments(' + p.id + ',\'' + prefix + '\')">عرض التعليقات (' + p.comment_count + ')</button>'
    + '</div>'
    + '<div class="add-comment">'
    + '<input id="ci-' + prefix + p.id + '" placeholder="أضف تعليقاً..." onkeydown="if(event.key===\'Enter\')addComment(' + p.id + ',\'' + prefix + '\')">'
    + '<button onclick="addComment(' + p.id + ',\'' + prefix + '\')">نشر</button>'
    + '</div></div>';
}

/* ============ الستوري ============ */
function renderStories(stories) {
  let html = '<button class="story" id="myStoryRing">'
    + '<span class="ring">' + avatarHTML(me, 59) + '</span><span>قصتك</span></button>';
  stories.forEach(function (s) {
    html += '<button class="story" data-id="' + s.user_id + '" data-name="' + esc(s.username) + '">'
      + '<span class="ring">' + avatarHTML(s, 59) + '</span><span>' + esc(s.username) + '</span></button>';
  });
  storiesEl.innerHTML = html;

  document.getElementById('myStoryRing').onclick = openStoryCreate;
  storiesEl.querySelectorAll('.story[data-id]').forEach(function (el) {
    el.onclick = function () {
      openStoryViewer(parseInt(el.dataset.id, 10), el.dataset.name);
    };
  });
}

function openStoryCreate() {
  document.getElementById('storyCreateModal').hidden = false;
}
function closeStoryCreate() {
  document.getElementById('storyCreateModal').hidden = true;
  document.getElementById('storyMedia').value = '';
  document.getElementById('storyPreview').textContent = '📷 اختر صورة أو فيديو';
  document.getElementById('storyPublishBtn').disabled = false;
}
document.getElementById('storyMedia').addEventListener('change', function (e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = function (ev) {
    const tag = f.type.startsWith('video/') ? 'video' : 'img';
    document.getElementById('storyPreview').innerHTML = '<' + tag + ' src="' + ev.target.result + '" controls playsinline></' + tag + '>';
  };
  r.readAsDataURL(f);
});
async function publishStory() {
  const file = document.getElementById('storyMedia').files[0];
  if (!file) return alert('اختر صورة أو فيديو أولاً');
  const fd = new FormData();
  fd.append('media', file);
  const btn = document.getElementById('storyPublishBtn');
  btn.disabled = true; btn.textContent = 'جاري النشر...';
  try {
    await api('/api/stories', { method: 'POST', body: fd });
    closeStoryCreate();
    showFeed();
  } catch (e) {
    alert(e.message);
    btn.disabled = false; btn.textContent = 'نشر القصة';
  }
}

/* ============ عارض القصص ============ */
async function openStoryViewer(userId, username) {
  try {
    const stories = await api('/api/users/' + userId + '/stories');
    if (!stories.length) { alert('لا توجد قصص متاحة'); return; }
    storyList = stories;
    storyIndex = 0;
    document.getElementById('storyModal').hidden = false;
    document.getElementById('svHead').innerHTML =
      '<div>' + username + '<small>' + timeAgo(stories[0].created_at) + '</small></div>'
      + '<button class="sv-close" onclick="closeStoryViewer()">✕</button>';
    showStorySlide();
  } catch (e) { alert(e.message); }
}
function showStorySlide() {
  const s = storyList[storyIndex];
  if (!s) { closeStoryViewer(); return; }
  document.getElementById('svMedia').innerHTML =
    s.media_type === 'video'
      ? '<video src="' + assetUrl(s.media_url) + '" autoplay muted playsinline controls></video>'
      : '<img src="' + assetUrl(s.media_url) + '">';
  const bar = document.getElementById('svProgress');
  bar.style.animation = 'none';
  void bar.offsetWidth;
  bar.style.animation = '';
  clearTimeout(storyTimer);
  storyTimer = setTimeout(nextStory, 5000);
}
function nextStory() {
  storyIndex++;
  showStorySlide();
}
function closeStoryViewer() {
  clearTimeout(storyTimer);
  document.getElementById('storyModal').hidden = true;
  document.getElementById('svMedia').innerHTML = '';
}

/* ============ الإعجاب والتعليقات ============ */
async function toggleLike(postId, btn) {
  try {
    const data = await api('/api/posts/' + postId + '/like', { method: 'POST' });
    btn.textContent = data.liked ? '❤️' : '🤍';
    btn.classList.toggle('liked', data.liked);
    const lc = document.getElementById('lc-' + postId);
    if (lc) lc.textContent = data.like_count + ' إعجاب';
  } catch (e) { alert(e.message); }
}

async function loadComments(postId, prefix) {
  const box = document.getElementById('comments-' + prefix + postId);
  if (!box) return;
  try {
    const comments = await api('/api/posts/' + postId + '/comments');
    box.innerHTML = comments.length
      ? comments.map(function (c) {
          return '<div class="comment-row"><b onclick="showProfile(\'' + c.username + '\')">' + esc(c.username) + '</b>' + esc(c.body) + '</div>';
        }).join('')
      : '<small class="muted">لا توجد تعليقات بعد</small>';
  } catch (e) { /* تجاهل */ }
}

async function addComment(postId, prefix) {
  const input = document.getElementById('ci-' + prefix + postId);
  const body = input.value.trim();
  if (!body) return;
  try {
    await api('/api/posts/' + postId + '/comments', { method: 'POST', body: JSON.stringify({ body: body }) });
    input.value = '';
    loadComments(postId, prefix);
    const btn = document.querySelector('[data-post="' + postId + '"] .show-comments');
    if (btn) {
      const m = btn.textContent.match(/\((\d+)\)/);
      if (m) btn.textContent = btn.textContent.replace(m[0], '(' + (parseInt(m[1], 10) + 1) + ')');
    }
  } catch (e) { alert(e.message); }
}

async function delPost(postId) {
  if (!confirm('هل تريد حذف هذا المنشور؟')) return;
  try {
    await api('/api/posts/' + postId, { method: 'DELETE' });
    const el = document.querySelector('[data-post="' + postId + '"]');
    if (el) el.remove();
  } catch (e) { alert(e.message); }
}

/* ============ عرض منشور في مودال ============ */
async function openPost(postId) {
  try {
    const p = await api('/api/posts/' + postId);
    document.getElementById('postModalBody').innerHTML = postCard(p, 'm-');
    document.getElementById('postModal').hidden = false;
    loadComments(postId, 'm-');
  } catch (e) { alert(e.message); }
}

/* ============ البحث ============ */
function showSearch() {
  setView('search');
  setTimeout(function () { searchInput.focus(); }, 50);
}
searchInput.addEventListener('input', function () {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () { runSearch(searchInput.value.trim()); }, 300);
});
async function runSearch(q) {
  if (!q) {
    resultsEl.innerHTML = '<p class="muted center" style="padding:30px">ابحث عن مستخدمين بالاسم</p>';
    return;
  }
  resultsEl.innerHTML = '<p class="loading-txt">جاري البحث...</p>';
  try {
    const users = await api('/api/search?q=' + encodeURIComponent(q));
    resultsEl.innerHTML = users.length
      ? users.map(function (u) {
          return '<div class="user-row">'
            + avatarHTML(u, 42)
            + '<div class="u-info" onclick="showProfile(\'' + u.username + '\')"><b>' + esc(u.username) + '</b>'
            + '<small>' + esc(u.bio || '') + '</small></div>'
            + '<button class="follow-btn' + (u.i_follow ? ' following' : '') + '" onclick="toggleFollow(' + u.id + ',this)">'
            + (u.i_follow ? '✓ تتابعه' : 'متابعة') + '</button></div>';
        }).join('')
      : '<p class="muted center" style="padding:30px">لا توجد نتائج</p>';
  } catch (e) {
    resultsEl.innerHTML = '<p class="muted center" style="padding:30px">' + esc(e.message) + '</p>';
  }
}

/* ============ المتابعة ============ */
async function toggleFollow(userId, btn) {
  try {
    const data = await api('/api/users/' + userId + '/follow', { method: 'POST' });
    if (currentProfileUser) { showProfile(currentProfileUser); return; }
    btn.textContent = data.following ? '✓ تتابعه' : 'متابعة';
    btn.classList.toggle('following', data.following);
  } catch (e) { alert(e.message); }
}

/* ============ الملف الشخصي ============ */
async function showProfile(username) {
  setView('profile');
  currentProfileUser = username;
  profileEl.innerHTML = '<p class="loading-txt">جاري التحميل...</p>';
  try {
    const u = await api('/api/users/' + encodeURIComponent(username));
    const isMe = u.id === me.id;
    let html = '<div class="profile-head">' + avatarHTML(u, 80)
      + '<div class="p-stats">'
      + '<div><b>' + u.post_count + '</b><span>منشور</span></div>'
      + '<div><b>' + u.followers_count + '</b><span>متابع</span></div>'
      + '<div><b>' + u.following_count + '</b><span>يتابع</span></div>'
      + '</div></div>'
      + '<div class="p-name"><b>' + esc(u.username) + '</b></div>'
      + '<p class="p-bio">' + esc(u.bio || '') + '</p>'
      + '<div class="p-actions">'
      + (isMe
          ? '<button class="edit-btn" onclick="openSettings()">تعديل الملف الشخصي</button>'
          : '<button class="follow-btn big' + (u.i_follow ? ' following' : '') + '" onclick="toggleFollow(' + u.id + ',this)">'
            + (u.i_follow ? 'إلغاء المتابعة' : 'متابعة') + '</button>')
      + '</div>'
      + '<div class="p-grid">';

    if (u.posts.length) {
      u.posts.forEach(function (p) {
        const src = p.media_type === 'video' ? thumbUrl(p.media_url) : assetUrl(p.media_url);
        html += '<div class="cell" onclick="openPost(' + p.id + ')">'
          + (p.media_type === 'video' ? '<video src="' + assetUrl(p.media_url) + '" muted playsinline preload="metadata"></video><span class="video-badge">▶ فيديو</span>' : '<img src="' + src + '" loading="lazy">')
          + '</div>';
      });
    } else {
      html += '<p class="muted center" style="padding:30px;grid-column:1/-1">لا توجد منشورات بعد</p>';
    }
    html += '</div>';
    profileEl.innerHTML = html;
  } catch (e) {
    profileEl.innerHTML = '<p class="muted center" style="padding:30px">' + esc(e.message) + '</p>';
  }
}

/* ============ إنشاء منشور ============ */
function openCreate() {
  document.getElementById('createModal').hidden = false;
}
function closeCreate() {
  document.getElementById('createModal').hidden = true;
  document.getElementById('postMedia').value = '';
  document.getElementById('postCaption').value = '';
  document.getElementById('mediaPreview').textContent = '📷 اضغط لاختيار صورة أو فيديو';
  document.getElementById('publishBtn').disabled = false;
  document.getElementById('publishBtn').textContent = 'نشر';
}
document.getElementById('postMedia').addEventListener('change', function (e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = function (ev) {
    const tag = f.type.startsWith('video/') ? 'video' : 'img';
    document.getElementById('mediaPreview').innerHTML = '<' + tag + ' src="' + ev.target.result + '" controls playsinline></' + tag + '>';
  };
  r.readAsDataURL(f);
});
async function publishPost() {
  const file = document.getElementById('postMedia').files[0];
  const caption = document.getElementById('postCaption').value.trim();
  if (!file && !caption) return alert('أضف صورة/فيديو أو نصاً على الأقل');
  const fd = new FormData();
  if (file) fd.append('media', file);
  fd.append('caption', caption);
  const btn = document.getElementById('publishBtn');
  btn.disabled = true; btn.textContent = 'جاري النشر...';
  try {
    await api('/api/posts', { method: 'POST', body: fd });
    closeCreate();
    showFeed();
  } catch (e) {
    alert(e.message);
    btn.disabled = false; btn.textContent = 'نشر';
  }
}

/* ============ الإعدادات (تعديل الملف) ============ */
function openSettings() {
  document.getElementById('bioInput').value = me.bio || '';
  document.getElementById('avatarPreview').innerHTML = '<img src="' + assetUrl(me.avatar_url) + '">';
  document.getElementById('settingsModal').hidden = false;
}
function closeSettings() {
  document.getElementById('settingsModal').hidden = true;
  document.getElementById('avatarInput').value = '';
}
document.getElementById('avatarInput').addEventListener('change', function (e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = function (ev) {
    document.getElementById('avatarPreview').innerHTML = '<img src="' + ev.target.result + '">';
  };
  r.readAsDataURL(f);
});
async function saveProfile() {
  const btn = document.getElementById('saveProfileBtn');
  btn.disabled = true; btn.textContent = 'جاري الحفظ...';
  try {
    const avatarFile = document.getElementById('avatarInput').files[0];
    if (avatarFile) {
      const fd = new FormData();
      fd.append('avatar', avatarFile);
      me = await api('/api/me/avatar', { method: 'POST', body: fd });
    }
    me = await api('/api/me', { method: 'PATCH', body: JSON.stringify({ bio: document.getElementById('bioInput').value }) });
    closeSettings();
    showProfile(me.username);
  } catch (e) {
    alert(e.message);
    btn.disabled = false; btn.textContent = 'حفظ';
  }
}

/* ============ خروج ============ */
function logout() {
  localStorage.removeItem('camorro_token');
  location.href = 'index.html';
}

(async function init() {
  if (!token) { location.href = 'index.html'; return; }

    me = await api('/api/me');
    showFeed();
  } catch (e) {
    localStorage.removeItem('camorro_token');
    location.href = 'index.html';
  }
})();
